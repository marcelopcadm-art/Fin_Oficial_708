@media (min-width:900px){
 #shell{flex-direction:row}

@media (max-width:430px){

<script>
const $=s=>document.querySelector(s);
const K='fin_casal_v1',KC='fin_casal_code';
const FB_ON=FB_CFG.apiKey!=='COLE_AQUI';
let CODE='';try{CODE=localStorage.getItem(KC)||''}catch(e){}
const mkDef=()=>({tx:[],goals:[],open:{},disp:0,inv:0,mv:[],paid:{},fxv:{},
 fx:['Financiamento AP','Condomínio','Energia','Internet','Celular','TV','Vaga garagem'].map((n,i)=>({id:'f'+(i+1),name:n,due:10})),
 close:18,due:25,cards:{nubank:{n:'Nubank',l:9830},santander:{n:'Santander',l:19600},mp:{n:'Mercado Pago',l:2300}}});
/* Migra estados antigos (Guardado/offsets separados) para o Disponível único, uma única vez */
function migrate(raw){
 if(raw&&!('disp'in raw)){
  const t=today();let c=(raw.dOff||raw.bal0||0);
  S.tx.forEach(x=>{if(x.date>t)return;if(x.type==='receita')c+=x.value;else if(x.type!=='invest'&&!S.cards[x.pay])c-=x.value});
  for(const k in S.fxv){const e=S.fxv[k];if(e&&e.p)c-=e.v}
  for(const k in S.paid)c-=S.paid[k].v;
  S.disp=c;S.inv=raw.i0||0;
 }
 delete S.res;delete S.bal0;delete S.dOff;delete S.i0;
}
let S=mkDef();
try{const r=localStorage.getItem(K);if(r){const raw=JSON.parse(r);S=Object.assign(mkDef(),raw);migrate(raw)}}catch(e){}

function setSt(s){
 const e=$('#st');if(!e)return;
 const m={ok:['● Sincronizado','ok'],sync:['● Salvando…',''],err:['● Sem conexão (salvo aqui)','err'],conn:['● Conectando…',''],local:['● Só neste aparelho','']}[s];
 e.textContent=m[0];e.className=m[1];
}
const ed=()=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName);
const cache=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const save=()=>{
 cache();
 if(window.cloud&&CODE){setSt('sync');cloud.save(CODE,S).then(()=>setSt('ok')).catch(()=>setSt('err'))}
};
function connect(){
 if(!FB_ON||!window.cloud||!CODE)return;
 cloud.start(CODE,r=>{
  if(r){
   if(JSON.stringify(r)!==JSON.stringify(S)){S=Object.assign(mkDef(),r);migrate(r);cache();if(!ed())render()}
  }else if(S.tx.length)cloud.save(CODE,S);
  setSt('ok');
 },()=>setSt('err'));
}
window.addEventListener('cloud-ready',connect);
function setCode(){
 const c=$('#cd').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
 if(c.length<6)return toast('Use pelo menos 6 letras/números');
 CODE=c;try{localStorage.setItem(KC,c)}catch(e){}
 setSt('conn');connect();render(true);
}
function trocarCodigo(){CODE='';try{localStorage.removeItem(KC)}catch(e){}if(window.cloud)cloud.stop();setSt('conn');render(true)}

const CATS={
gasto:{
'Moradia':['Aluguel/Financiamento','Condomínio','IPTU','Energia elétrica','Água e esgoto','Gás','Internet','Celular/Telefone','Manutenção e reforma','Móveis e decoração','Eletrodomésticos'],
'Alimentação':['Supermercado','Feira/Hortifruti','Restaurantes','Delivery/iFood','Padaria/Café','Bares e lanches'],
'Transporte':['Combustível','Uber/99','Transporte público','Estacionamento','Pedágio','IPVA/Licenciamento','Seguro do carro','Manutenção do carro','Financiamento do carro','Multas'],
'Saúde':['Plano de saúde','Farmácia','Consultas e exames','Dentista','Terapia','Academia'],
'Educação':['Escola/Faculdade','Cursos','Livros','Material escolar'],
'Lazer':['Streaming','Viagens','Passeios e cinema','Jogos','Hobbies','Festas e eventos','Assinaturas/Apps'],
'Pessoal':['Roupas e calçados','Beleza e salão','Cosméticos','Presentes','Eletrônicos','Compras online'],
'Família':['Filhos','Pets','Ajuda a familiares','Doações'],
'Finanças':['Empréstimos','Juros e tarifas','Seguros','Impostos','Anuidade do cartão','Contador'],
'Outros':['Imprevistos','Diversos']},
receita:['Salário','13º / Férias','Bônus / PLR','Freelance / Extra','Aluguel recebido','Dividendos / Rendimentos','Reembolso','Venda de algo','Outras receitas'],
invest:['Reserva de emergência','Ações','FIIs','CDB','Tesouro Direto','LCI / LCA','Poupança','Previdência','Cripto','Imóveis','Fundos','Outros investimentos']};
const KW={supermercado:'Supermercado',mercado:'Supermercado',atacad:'Supermercado',ifood:'Delivery/iFood',uber:'Uber/99',posto:'Combustível',gasolina:'Combustível',netflix:'Streaming',spotify:'Streaming',disney:'Streaming',prime:'Streaming',farm:'Farmácia',drog:'Farmácia',padaria:'Padaria/Café',restaurante:'Restaurantes',luz:'Energia elétrica',energia:'Energia elétrica',internet:'Internet',aluguel:'Aluguel/Financiamento',academia:'Academia',pet:'Pets',roupa:'Roupas e calçados',renner:'Roupas e calçados',shopee:'Compras online',amazon:'Compras online',icloud:'Assinaturas/Apps',google:'Assinaturas/Apps'};
const PAYN={pix:'Pix/Débito',dinheiro:'Dinheiro',conta:''};

const R=v=>{if(Math.abs(v)<0.005)v=0;return (v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
const num=s=>{s=String(s).replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}$/.test(s))s=s.replace('.','');return parseFloat(s)};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addM=(ym,n)=>{let[y,m]=ym.split('-').map(Number);let z=m-1+n;y+=Math.floor(z/12);z=((z%12)+12)%12;return y+'-'+pad(z+1)};
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mLabel=ym=>MN[+ym.slice(5)-1]+' '+ym.slice(0,4);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shiftDate=(dt,i)=>{const ym=addM(dt.slice(0,7),i),[y,m]=ym.split('-').map(Number);return ym+'-'+pad(Math.min(+dt.slice(8),new Date(y,m,0).getDate()))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let tab='resumo',M=today().slice(0,7),F={type:'gasto'};

/* Fatura: compra até o dia do fechamento (18) entra na fatura do próprio mês (vence dia 25);
   compra depois do fechamento entra na fatura do mês seguinte. */
const invYM=d=>+d.slice(8,10)>S.close?addM(d.slice(0,7),1):d.slice(0,7);
M=invYM(today());
const parcels=t=>{const n=t.inst||1,b=invYM(t.date);return Array.from({length:n},(_,i)=>({ym:addM(b,i),v:t.value/n}))};



/* Receita do dia 28 em diante já conta para o mês seguinte (paga as contas de lá) */
const recYM=t=>+t.date.slice(8)>=28?addM(t.date.slice(0,7),1):t.date.slice(0,7);
function calc(m){
 const o={rec:0,pix:0,fix:0,cards:{},cat:{},cardTot:0};
 for(const k in S.cards)o.cards[k]=0;
 S.tx.forEach(t=>{
  const ym=t.date.slice(0,7);
  if(t.type==='receita'){if(recYM(t)===m)o.rec+=t.value}
  else if(t.type==='invest')return;
  else if(S.cards[t.pay]){parcels(t).forEach(p=>{if(p.ym===m){o.cards[t.pay]+=p.v;o.cat[t.cat]=(o.cat[t.cat]||0)+p.v}})}
  else if(ym===m){o.pix+=t.value;o.cat[t.cat]=(o.cat[t.cat]||0)+t.value}
 });
 for(const k in S.cards)o.cardTot+=o.cards[k];
 S.fx.forEach(f=>{const e=S.fxv[m+'|'+f.id];if(e&&e.v>0){o.fix+=e.v;o.cat['Contas fixas']=(o.cat['Contas fixas']||0)+e.v}});
 o.left=o.rec-o.fix-o.cardTot-o.pix;
 return o;
}

/* Contas do mês (fixas + faturas) com a checagem "tem receita antes do vencimento?" */
function bills(m){
 const c=calc(m),b=[];
 S.fx.forEach(f=>{const e=S.fxv[m+'|'+f.id]||{};if(e.v>0)b.push({k:'fx',id:f.id,m,l:f.name,d:m+'-'+pad(f.due||10),v:e.v,p:!!e.p})});
 for(const k in S.cards){const pd=S.paid[m+'|'+k],v=pd?pd.v:c.cards[k];if(v>0.004)b.push({k:'card',id:k,m,l:'Fatura '+S.cards[k].n,d:m+'-'+pad(S.due),v,p:!!pd})}
 return b.sort((a,z)=>a.d.localeCompare(z.d));
}

/* Disponível: um único saldo centralizado, mutado a cada ação (não recalculado do zero).
   Receita soma na hora; Pix/débito desconta na hora; contas fixas e faturas só descontam ao marcar paga/quitada. */
const NM={disp:'Disponível',inv:'Investido'};
function bal(a){return a==='inv'?S.inv:S.disp}
function txEffect(t){
 if(t.type==='receita')return t.value;
 if(t.type==='gasto'&&!S.cards[t.pay])return -t.value;
 return 0;
}
function togFx(m,id){
 const k=m+'|'+id,e=S.fxv[k]||(S.fxv[k]={v:0,p:0});
 if(!e.v)return toast('Informe o valor antes de marcar como paga');
 e.p=!e.p;S.disp+=e.p?-e.v:e.v;save();render();
}
function togInv(m,k){
 const key=m+'|'+k;
 if(S.paid[key]){S.disp+=S.paid[key].v;delete S.paid[key]}
 else{const v=calc(m).cards[k];if(v<=0.004)return;S.paid[key]={v,d:today()};S.disp-=v}
 save();render();
}

function tips(){
 const op=invYM(today()),c=calc(M),t=[],rec=c.rec,gasto=c.fix+c.cardTot+c.pix,g=bal('inv'),dsp=bal('disp');
 const pc=(a,b)=>b>0?Math.round(a/b*100):0,add=(k,x)=>t.push({k,x});
 const cats=Object.entries(c.cat).filter(x=>x[0]!=='Contas fixas').sort((a,b)=>b[1]-a[1]),varT=cats.reduce((s,x)=>s+x[1],0);
 let venc=0;for(let i=-12;i<0;i++){const m=addM(op,i),cc=calc(m);for(const k in S.cards)if(!S.paid[m+'|'+k]&&cc.cards[k]>0.004)venc+=cc.cards[k]}
 if(venc>0)add('r',`Há <b>${R(venc)}</b> em faturas fechadas sem quitar. Pague ou marque como quitada para o saldo ficar certo e evitar juros do rotativo.`);
 if(!rec){add('a','Nenhuma receita lançada em '+mLabel(M)+'. Lance suas receitas para a previsão de sobra ficar correta.');return t}
 if(c.left<0)add('r',`O mês fecha <b>${R(-c.left)}</b> no negativo. ${cats.length?`Comece cortando <b>${esc(cats[0][0])}</b> (${R(cats[0][1])}) `:''}e evite novas compras no cartão até equilibrar.`);
 else{
  const sr=pc(c.left,rec);
  if(sr<10)add('a',`Sobra de só <b>${sr}%</b> da receita. Uma meta saudável é guardar 10–20%: tente separar <b>${R(rec*.1)}</b> a <b>${R(rec*.2)}</b> por mês.`);
  else if(sr>=20)add('g',`Boa: sobra de <b>${sr}%</b> da receita. Não deixe parada: mova para Investimento na aba Dinheiro.`);
  else add('g',`Sobra de <b>${sr}%</b> da receita, dentro da faixa de 10–20%. Tente subir um pouco cortando o maior gasto variável.`);
  if(dsp>0&&c.left>0)add('a',`Assim que puder, mova <b>${R(Math.min(c.left,dsp))}</b> do Disponível para Investimento (aba Dinheiro), antes que vire gasto.`);
 }
 if(pc(c.cardTot,rec)>30)add('r',`As faturas consomem <b>${pc(c.cardTot,rec)}%</b> da receita. Evite novos parcelamentos e priorize quitar o que tem juros.`);
 const n1=calc(addM(M,1)).cardTot,n2=calc(addM(M,2)).cardTot;
 if(n1>0)add('a',`Já estão comprometidos <b>${R(n1)}</b> na fatura de ${mLabel(addM(M,1))} e <b>${R(n2)}</b> em ${mLabel(addM(M,2))} só com compras e parcelas lançadas.`);
 if(pc(c.fix,rec)>45)add('r',`As contas fixas pesam <b>${pc(c.fix,rec)}%</b> da receita. Renegocie internet, celular e TV e reveja o que dá para cortar.`);
 if(cats.length&&varT>0&&pc(cats[0][1],varT)>=35)add('a',`<b>${esc(cats[0][0])}</b> é ${pc(cats[0][1],varT)}% dos seus gastos variáveis. Estabelecer um teto mensal aqui é o caminho mais rápido para sobrar mais.`);
 if(gasto>0){const me=g/gasto;
  if(me<6)add('r',`Sua reserva (Investido) cobre <b>${me.toFixed(1)} mês(es)</b> de gastos. Meta: 6 meses (${R(6*gasto)}). Faltam ${R(Math.max(0,6*gasto-g))}: esta é a prioridade antes de investir em risco.`);
  else add('g',`Reserva de emergência cobre <b>${me.toFixed(1)} meses</b> de gastos. Pode direcionar a sobra para investimentos de prazo maior.`);
  if(dsp>2*gasto)add('a',`Você mantém <b>${R(dsp)}</b> parado no Disponível, mais que o dobro do gasto mensal. Parte disso pode render em CDB/Tesouro Selic com liquidez.`);
 }
 const sv=S.fx.filter(f=>!(S.fxv[M+'|'+f.id]||{}).v).length;
 if(sv)add('a',`${sv} custo(s) fixo(s) ainda sem valor em ${mLabel(M)}: a sobra está maior do que realmente será.`);
 return t;
}

function parseBulk(txt,dd){
 const out=[];
 txt.split('\n').forEach(line=>{
  let s=line.trim();if(!s)return;let date=dd,inst=1,m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if(m){const y=m[3]?(m[3].length==2?'20'+m[3]:m[3]):dd.slice(0,4);date=y+'-'+pad(m[2])+'-'+pad(m[1]);s=s.replace(m[0],' ')}
  m=s.match(/\b(\d{1,2})\s*x\b/i);if(m){inst=+m[1];s=s.replace(m[0],' ')}
  const nums=[...s.matchAll(/\d[\d.]*(?:,\d{1,2})?/g)];if(!nums.length)return;
  const nm=nums[nums.length-1],v=num(nm[0]);
  const desc=(s.slice(0,nm.index)+' '+s.slice(nm.index+nm[0].length)).replace(/R\$|[;|\t]+/g,' ').replace(/\s+/g,' ').trim()||'Sem descrição';
  if(v>0)out.push({date,desc,value:v,inst});
 });
 return out;
}

function addFx(){const n=$('#fn').value.trim();if(!n)return toast('Informe o nome');S.fx.push({id:uid(),name:n,due:Math.min(28,Math.max(1,+$('#fd').value||10))});save();toast('Custo adicionado ✓');render()}
function copyFx(){const p=addM(M,-1);S.fx.forEach(f=>{const a=S.fxv[p+'|'+f.id],k=M+'|'+f.id;if(a&&a.v&&!(S.fxv[k]&&S.fxv[k].v))S.fxv[k]={v:a.v,p:0}});save();toast('Valores copiados');render()}

function vDinheiro(){
 const mvs=S.mv.slice().reverse().slice(0,15).map(m=>`<div class="row"><span>${m.date.slice(8)}/${m.date.slice(5,7)} · ${NM[m.from]} → ${NM[m.to]}</span><span class="r">${R(m.v)} <button class="x" onclick="delMv('${m.id}')" title="Desfazer">×</button></span></div>`).join('')||'<p class="mu"><small>Nenhuma movimentação ainda.</small></p>';
 const gl=S.goals.map(g=>{const d=g.dep||0,pc=Math.min(100,d/g.target*100);return `<div class="goal"><div class="row" style="border:0;padding:0"><span>${esc(g.name)}<br><small class="mu">${R(d)} de ${R(g.target)}</small></span><span class="r"><span class="pc">${pc.toFixed(1)}%</span></span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="dp"><label style="margin:0;flex:1">Guardei para esta meta (− para retirar)<input id="dp${g.id}" type="text" inputmode="decimal" placeholder="0,00"></label><button onclick="depGoal('${g.id}')">Somar</button><button class="x" onclick="delGoal('${g.id}')" title="Apagar meta">×</button></div></div>`}).join('')||'<p class="mu"><small>Nenhuma meta ainda.</small></p>';
 return `<div class="grid2"><div class="mini"><small>Disponível (tudo o que você tem em conta)</small><b class="${bal('disp')<=0?'neg':''}">${R(bal('disp'))}</b></div><div class="mini"><small>Investido</small><b>${R(bal('inv'))}</b></div></div>
 <div class="cols"><div class="card"><h2>Mover dinheiro</h2><label>Movimento<select id="mo"><option value="disp>inv">Disponível → Investimento</option><option value="inv>disp">Investimento → Disponível (resgate)</option></select></label>
 <label>Valor (R$)<input id="mval" type="text" inputmode="decimal" placeholder="0,00"></label><button class="btn" onclick="mover()">Mover</button>
 <h2 style="margin-top:26px">Últimas movimentações</h2>${mvs}</div>
 <div class="card"><h2>Corrigir um saldo</h2><p class="mu" style="margin-top:0"><small>O <b>Disponível</b> é o total que você tem em conta: soma as receitas e desconta Pix/débito/dinheiro na hora do lançamento, e as contas fixas e faturas só descontam quando você marca como paga/quitada. Use aqui para acertar o valor real, por exemplo após lançar um histórico de meses.</small></p>
 <label>Saldo de<select id="ca"><option value="disp">Disponível</option><option value="inv">Investido</option></select></label>
 <label>Valor correto (R$)<input id="cv" type="text" inputmode="decimal" placeholder="0,00"></label><button class="btn g" style="margin-top:0" onclick="corrigir()">Corrigir</button></div></div>
 <div class="card" style="margin-bottom:10px">${panorama()}</div>
 <div class="cols"><div class="card"><h2>Metas</h2>${gl}</div><div class="card"><h2>Nova meta</h2><label>Nome<input id="gn" placeholder="Ex.: Viagem, entrada do apê"></label><label>Valor da meta (R$)<input id="gv" type="text" inputmode="decimal" placeholder="0,00"></label><button class="btn" onclick="addGoal()">Criar meta</button></div></div>`;
}
function mover(){
 const[f,t]=$('#mo').value.split('>'),v=num($('#mval').value),b=bal(f);
 if(!(v>0))return toast('Informe o valor');
 if(b<=0)return alert('Não dá para tirar de '+NM[f]+': o saldo está em '+R(b)+'.');
 if(v>b)return alert('Saldo insuficiente em '+NM[f]+'. Você tem '+R(b)+' e tentou mover '+R(v)+'.');
 if(f==='disp')S.disp-=v;else S.inv-=v;
 if(t==='disp')S.disp+=v;else S.inv+=v;
 S.mv.push({id:uid(),date:today(),from:f,to:t,v});save();toast('Movido ✓');render();
}
function delMv(id){
 const m=S.mv.find(x=>x.id===id);if(!m)return;
 if(m.to==='disp')S.disp-=m.v;else S.inv-=m.v;
 if(m.from==='disp')S.disp+=m.v;else S.inv+=m.v;
 S.mv=S.mv.filter(x=>x.id!==id);save();render();
}
function corrigir(){const a=$('#ca').value,v=num($('#cv').value);if(isNaN(v))return toast('Informe um valor');if(a==='disp')S.disp=v;else S.inv=v;save();toast('Saldo corrigido ✓');render()}


function addGoal(){const v=num($('#gv').value),n=$('#gn').value.trim();if(!n||!(v>0))return toast('Informe o nome e o valor');S.goals.push({id:uid(),name:n,target:v,dep:0});save();toast('Meta criada ✓');render()}
function depGoal(id){const g=S.goals.find(x=>x.id===id),v=num($('#dp'+id).value);if(!g||!v)return toast('Informe um valor');g.dep=(g.dep||0)+v;save();toast('Valor guardado ✓');render()}
function delGoal(id){if(!confirm('Apagar esta meta?'))return;S.goals=S.goals.filter(x=>x.id!==id);save();render()}

/* ---------- FATURAS ---------- */
function invItems(m,k){
 const r=[];S.tx.forEach(t=>{if(t.pay!==k)return;parcels(t).forEach((p,i)=>{if(p.ym===m)r.push({d:t.desc,v:p.v,n:t.inst>1?(i+1)+'/'+t.inst:''})})});
 return r.sort((a,b)=>b.v-a.v);
}
function invMonth(m,op){
 const c=calc(m),ks=Object.keys(S.cards).filter(k=>c.cards[k]>0.004||S.paid[m+'|'+k]);
 if(!ks.length&&m!==op)return{skip:1};
 const un=ks.some(k=>!S.paid[m+'|'+k]),tot=ks.reduce((t,k)=>t+(S.paid[m+'|'+k]?S.paid[m+'|'+k].v:c.cards[k]),0);
 return{ks,un,tot,venc:m<op&&un};
}
function invRow(m,d,ks,un,tot,c){
 return `<div class="goal"><div class="row" style="border:0;padding:0"><span><b>${mLabel(m)}</b> <small class="${d[1]}">${d[0]}</small><br><small class="mu">fecha ${pad(S.close)}/${m.slice(5)} · vence ${pad(S.due)}/${m.slice(5)}</small></span><span class="r"><b>${R(tot)}</b><br>${ks.length?(un?`<button class="chk" onclick="quitMes('${m}')">Quitar mês</button>`:'<small class="pos">Quitada ✓</small>'):''}</span></div>`+
 (ks.map(k=>{const pd=S.paid[m+'|'+k],v=pd?pd.v:c.cards[k],it=invItems(m,k);return `<div class="row"><span>${S.cards[k].n}${pd?` <small class="pos">quitada ${pd.d.slice(8)}/${pd.d.slice(5,7)}</small>`:''}${it.length?`<details><summary>${it.length} ite${it.length>1?'ns':'m'}</summary>${it.map(x=>`<div class="it"><span>${esc(x.d)}${x.n?' · '+x.n:''}</span><span>${R(x.v)}</span></div>`).join('')}</details>`:''}</span><span class="r">${R(v)}<br><button class="chk ${pd?'on':''}" onclick="togInv('${m}','${k}')">${pd?'Quitada':'Quitar'}</button></span></div>`}).join('')||'<small class="mu">Sem compras ainda.</small>')+'</div>';
}
function togMais(){F.maisF=!F.maisF;render()}
function invList(){
 const op=invYM(today()),mais=!!F.maisF,rng=mais?[-6,12]:[-1,2];
 let h='<h2>Faturas por mês</h2>',venc=0,rows='';
 for(let i=rng[0];i<=rng[1];i++){
  const m=addM(op,i),c=calc(m),info=invMonth(m,op);if(info.skip)continue;
  if(info.venc)venc++;
  const d=m===op?['Aberta','pos']:m<op?(info.un?['Fechada · a pagar','neg']:['Fechada','mu']):['Futura','mu'];
  rows+=invRow(m,d,info.ks,info.un,info.tot,c);
 }
 return (venc?`<button class="btn g" style="margin:0 0 10px" onclick="quitFechadas()">Quitar todas as faturas fechadas (${venc})</button>`:'')+h+rows+
 `<button class="btn g" onclick="togMais()">${mais?'Ver menos meses':'Ver mais meses'}</button>`;
}
function instList(){
 const op=invYM(today()),L=[];let mes=0;
 S.tx.forEach(t=>{
  if(!S.cards[t.pay]||!(t.inst>1))return;
  const ps=parcels(t),last=ps[ps.length-1].ym;if(last<op)return;
  const i=Math.max(0,ps.findIndex(p=>p.ym>=op));if(ps[i].ym===op)mes+=ps[i].v;
  L.push({t,i,v:ps[0].v,last,ini:ps[0].ym>op?ps[0].ym:''});
 });
 L.sort((a,b)=>a.last.localeCompare(b.last));
 return `<h2>Parcelamentos em andamento</h2>`+(L.map(x=>`<div class="row"><span>${esc(x.t.desc)}<br><small class="mu">${S.cards[x.t.pay].n} · comprado em ${x.t.date.slice(8)}/${x.t.date.slice(5,7)}/${x.t.date.slice(0,4)}</small></span><span class="r">${R(x.v)}/mês<br><small class="mu">${x.ini?'começa em '+mLabel(x.ini)+' · ':'parcela '+(x.i+1)+'/'+x.t.inst+' · '}termina ${mLabel(x.last)} · restam ${R((x.t.inst-x.i)*x.v)}</small></span></div>`).join('')||'<p class="mu"><small>Nenhum parcelamento em andamento.</small></p>')+(mes?`<small class="mu">Parcelas na fatura aberta: ${R(mes)}</small>`:'');
}
function vCartoes(){
 const t=today(),first=+t.slice(8)>S.close?addM(t.slice(0,7),1):t.slice(0,7),cs=[0,1,2].map(i=>calc(addM(M,i)));
 return mnav()+`<p class="mu" style="margin:0 0 14px"><small>Fecha dia ${S.close} · vence dia ${S.due}. Compras de hoje entram na fatura de <b>${mLabel(invYM(t))}</b>.</small></p><div class="cols"><div class="card" style="grid-column:1/-1">${invList()}</div><div class="card" style="grid-column:1/-1">${instList()}</div>`+
 Object.entries(S.cards).map(([k,c])=>{
  let used=0;S.tx.forEach(x=>{if(x.pay===k)parcels(x).forEach(p=>{if(p.ym>=first&&!S.paid[p.ym+'|'+k])used+=p.v})});
  const av=c.l-used,pc=Math.min(100,used/c.l*100);
  return `<div class="card"><div class="row" style="border:0;padding-top:0"><h2 style="margin:0">${c.n}</h2><span class="${av<0?'neg':''}">${R(av)} livres</span></div>
  <div class="bar ${pc>85?'w':''}"><i style="width:${pc}%"></i></div>
  <small class="mu">Usado ${R(used)} de ${R(c.l)} (${pc.toFixed(0)}%), contando parcelas futuras não pagas</small>
  <div class="grid3" style="margin-top:14px">${cs.map((x,i)=>{const m=addM(M,i);return `<div class="mini"><small>${MN[+m.slice(5)-1].slice(0,3)}/${m.slice(2,4)}</small><b>${R(x.cards[k])}</b></div>`}).join('')}</div></div>`}).join('')+'</div>';
}

function limpaEx(){F.ex={a:'',b:''};render()}
function vExtrato(){
 const ex=F.ex||{a:'',b:''},rg=ex.a||ex.b,l=[];
 S.tx.forEach(t=>{
  if(rg){if((ex.a&&t.date<ex.a)||(ex.b&&t.date>ex.b))return;l.push({t,v:t.value,n:t.inst>1?t.inst+'x':''});return}
  if(S.cards[t.pay])parcels(t).forEach((p,i)=>{if(p.ym===M)l.push({t,v:p.v,n:t.inst>1?(i+1)+'/'+t.inst:''})});
  else if(t.date.slice(0,7)===M)l.push({t,v:t.value,n:''});
 });
 l.sort((a,b)=>b.t.date.localeCompare(a.t.date));
 const ent=l.filter(x=>x.t.type==='receita').reduce((s,x)=>s+x.v,0),sai=l.filter(x=>x.t.type!=='receita').reduce((s,x)=>s+x.v,0);
 const rows=l.slice(0,400).map(({t,v,n})=>{
  const cd=S.cards[t.pay],dt=t.date.slice(8)+'/'+t.date.slice(5,7)+(rg||t.date.slice(0,7)!==M?'/'+t.date.slice(2,4):'');
  const pay=cd?'Cartão '+cd.n+' · fatura '+mLabel(rg?invYM(t.date):M):PAYN[t.pay];
  return `<div class="row"><div style="min-width:0"><span class="mu">${dt}</span>&nbsp; ${esc(t.desc)}${n?' <b>'+n+'</b>':''}<br><small class="mu">${[pay,t.who,(!rg&&n)?'compra total '+R(t.value):''].filter(Boolean).join(' · ')}</small><br><select onchange="setCat('${t.id}',this.value)">${opts(t.type,t.cat)}</select></div>
  <div class="r ${t.type==='receita'?'pos':''}">${R(v)}<br><button class="x" onclick="del('${t.id}',${t.inst>1?t.inst:0})" title="Apagar">×</button></div></div>`}).join('');
 return `<div class="card" style="margin-bottom:10px"><h2>Filtrar por período</h2><div class="grid2"><label>De<input type="date" value="${ex.a||''}" onchange="F.ex=Object.assign(F.ex||{a:'',b:''},{a:this.value});render()"></label><label>Até<input type="date" value="${ex.b||''}" onchange="F.ex=Object.assign(F.ex||{a:'',b:''},{b:this.value});render()"></label></div>${rg?'<button class="btn g" style="margin-top:0" onclick="limpaEx()">Limpar filtro (voltar ao mês)</button>':'<small class="mu">Sem filtro: mostrando o mês selecionado.</small>'}<button class="btn" style="margin-top:8px" onclick="gerarPDF()">Gerar PDF do recibo deste período</button></div>`+(rg?'':mnav())+`<div class="grid"><div class="mini"><small>Entradas</small><b class="pos">${R(ent)}</b></div><div class="mini"><small>Saídas</small><b class="neg">${R(sai)}</b></div><div class="mini"><small>Saldo</small><b class="${ent-sai<0?'neg':''}">${R(ent-sai)}</b></div></div><div class="card"><h2>${rg?(ex.a?ex.a.split('-').reverse().join('/'):'início')+' a '+(ex.b?ex.b.split('-').reverse().join('/'):'hoje'):mLabel(M)} · ${l.length} itens</h2>${rows||'<p class="mu">Nenhum lançamento neste período.</p>'}<small class="mu">${rg?'No filtro por período, tudo aparece pela data da compra (cartão parcelado mostra o total da compra).':'Compras no cartão aparecem no mês da fatura (com a parcela); Pix, débito e receitas, pela data.'}</small></div>`;
}
function setCat(id,c){const t=S.tx.find(x=>x.id===id);if(t){t.cat=c;save();toast('Categoria alterada')}}
function del(id,n){
 if(n&&!confirm('Esta compra tem '+n+' parcelas. Apagar a compra inteira?'))return;
 const t=S.tx.find(x=>x.id===id);if(t)S.disp-=txEffect(t);
 S.tx=S.tx.filter(x=>x.id!==id);save();render();
}

/* ---------- RECIBO EM PDF ---------- */
function periodRange(){
 const ex=F.ex||{};
 if(ex.a||ex.b)return{a:ex.a||'0001-01-01',b:ex.b||today(),label:(ex.a?ex.a.split('-').reverse().join('/'):'início')+' a '+(ex.b?ex.b.split('-').reverse().join('/'):'hoje')};
 const[y,mo]=M.split('-').map(Number),last=new Date(y,mo,0).getDate();
 return{a:M+'-01',b:M+'-'+pad(last),label:mLabel(M)};
}
function periodMsg(rec,fat,pix,sobra){
 if(!rec)return'Nenhuma receita lançada neste período para calcular a sobra.';
 if(sobra<0)return`O período fechou ${R(-sobra)} no negativo. Reveja o maior gasto do período e evite novas compras no cartão até equilibrar as contas.`;
 const pc=Math.round(sobra/rec*100);
 if(pc<10)return`Sobrou só ${pc}% da receita neste período. Uma meta saudável é guardar entre 10% e 20% da receita (${R(rec*.1)} a ${R(rec*.2)}); reveja os gastos variáveis para chegar lá.`;
 if(pc>=20)return`Boa: sobraram ${pc}% da receita. Não deixe esse valor parado — mova para Investimento (aba Dinheiro) antes que vire gasto do próximo período.`;
 return`Sobraram ${pc}% da receita, dentro da faixa saudável de 10–20%. Para melhorar ainda mais, reveja a maior categoria de gasto do período e tente reduzir novos parcelamentos.`;
}
function gerarPDF(){
 if(!(window.jspdf&&window.jspdf.jsPDF)){toast('Gerador de PDF ainda carregando, tente de novo em instantes');return}
 const{a,b,label}=periodRange(),cardTot={};for(const k in S.cards)cardTot[k]=0;
 let pix=0,rec=0;
 S.tx.forEach(t=>{
  if(t.date<a||t.date>b)return;
  if(t.type==='receita')rec+=t.value;
  else if(S.cards[t.pay])cardTot[t.pay]+=t.value;
  else if(t.type==='gasto')pix+=t.value;
 });
 const faturaTot=Object.values(cardTot).reduce((s,v)=>s+v,0),sobra=rec-faturaTot-pix;
 const{jsPDF}=window.jspdf,doc=new jsPDF(),W=180;let y=20;
 const L=(t,sz,bold)=>{doc.setFont(undefined,bold?'bold':'normal');doc.setFontSize(sz);doc.text(String(t),15,y);y+=sz*0.62+2.5};
 doc.setTextColor(15,27,45);
 L('Recibo de custos do período',16,true);
 doc.setTextColor(90,90,90);L('Período: '+label+'  ·  gerado em '+today().split('-').reverse().join('/'),9,false);
 doc.setTextColor(15,27,45);y+=3;
 L('Fatura crédito:',12,true);
 let any=0;Object.entries(S.cards).forEach(([k,c])=>{if(cardTot[k]>0.004){L('     '+c.n+' - '+R(cardTot[k]),11,false);any=1}});
 if(!any)L('     nenhuma compra no cartão neste período',10,false);
 L('     Total faturas: '+R(faturaTot),11,true);
 y+=2;L('Débito e pix: '+R(pix),12,true);
 y+=2;L('Receita: '+R(rec),12,true);
 y+=3;L('Resumo do período',12,true);
 L((sobra<0?'Faltaram ':'Sobraram ')+R(Math.abs(sobra))+' no período (receita − faturas − débito/pix).',10,false);
 y+=3;L('O que fazer para melhorar:',11,true);
 doc.setFont(undefined,'normal');doc.setFontSize(10);
 doc.text(doc.splitTextToSize(periodMsg(rec,faturaTot,pix,sobra),W),15,y);
 doc.save('recibo-'+a+'-a-'+b+'.pdf');
 toast('PDF gerado ✓');
}

function vAjustes(){
 return `<div class="cols"><div class="card"><h2>Limites dos cartões</h2>${Object.entries(S.cards).map(([k,c])=>`<label>${c.n}<input type="text" inputmode="decimal" value="${c.l}" onchange="S.cards['${k}'].l=num(this.value)||0;save();toast('Limite salvo')"></label>`).join('')}
 <div class="grid2"><label>Dia de fechamento<input type="number" min="1" max="28" value="${S.close}" onchange="S.close=+this.value||18;save();render()"></label><label>Dia de vencimento<input type="number" min="1" max="28" value="${S.due}" onchange="S.due=+this.value||25;save();render()"></label></div></div>
 <div class="card"><h2>Sincronização</h2><p class="mu" style="margin-top:0"><small>${FB_ON?`Os dados são salvos na nuvem e aparecem em qualquer aparelho conectado com o código <b>${esc(CODE)}</b>.`:'Firebase ainda não configurado: os dados ficam só neste navegador.'}</small></p>
 ${FB_ON?'<button class="btn g" style="margin-top:0" onclick="trocarCodigo()">Trocar código do casal</button>':''}
 <h2 style="margin-top:26px">Backup manual</h2>
 <textarea id="bk" rows="4">${esc(JSON.stringify(S))}</textarea>
 <button class="btn g" onclick="imp()">Importar o texto da caixa</button>
 <button class="btn g" id="wp" onclick="wipe()">Apagar todos os dados</button></div></div>`;
}
function imp(){try{const o=JSON.parse($('#bk').value);if(!o.tx||!o.cards)throw 0;S=Object.assign(mkDef(),o);save();toast('Dados importados ✓');render()}catch(e){toast('Texto inválido')}}
function wipe(){const b=$('#wp');if(b.dataset.c){S=mkDef();save();toast('Tudo apagado');render()}else{b.dataset.c=1;b.textContent='Toque de novo para confirmar'}}

function render(top){
 const app=$('#app'),y=app.scrollTop,gate=FB_ON&&!CODE;
 app.innerHTML=gate?vCodigo():{resumo:vResumo,lancar:vLancar,fixas:vFixas,dinheiro:vDinheiro,cartoes:vCartoes,extrato:vExtrato,ajustes:vAjustes}[tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(!gate&&tab==='lancar'){pchg();iprev();bprev()}
 app.scrollTop=top===true?0:y;
}
setSt(FB_ON?(CODE?'conn':'local'):'local');
render();
if(window.cloud)connect();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
if(window.FB_CFG.apiKey!=="COLE_AQUI"){
 const db=getFirestore(initializeApp(window.FB_CFG));let unsub=null;
 window.cloud={
  start(code,onData,onErr){
   if(unsub)unsub();
   unsub=onSnapshot(doc(db,"casais",code),s=>{
    if(s.metadata.hasPendingWrites)return;
    onData(s.exists()?JSON.parse(s.data().json):null);
   },onErr);
  },
  stop(){if(unsub)unsub();unsub=null},
  save(code,data){return setDoc(doc(db,"casais",code),{json:JSON.stringify(data),t:Date.now()})}
 };
 window.dispatchEvent(new Event("cloud-ready"));
}
</script>
</body>
</html>
